<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>rate my threads vibe</title>
<link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@500;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#d6eeff; --ink:#1c2a45; --pink:#ff9ec4; --butter:#ffe066; --mint:#7fe3b8; --white:#fffdf8;
  --hd:"DynaPuff","Trebuchet MS","Segoe UI Rounded",sans-serif;
  --bd:"Gaegu","Trebuchet MS",sans-serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:12px}
body{margin:0;min-height:100vh;color:var(--ink);font:700 20px/1.35 var(--bd);
  background:var(--sky) radial-gradient(circle,#ffffff99 2px,transparent 2.5px) 0 0/26px 26px;
  padding:max(18px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom))}
main{max-width:620px;margin:0 auto}
h1,h2,h3{font-family:var(--hd);font-weight:700;margin:0;line-height:1.1}
h1{font-size:clamp(34px,9vw,52px)}
h2{font-size:26px}
p{margin:.4em 0}
.card{background:var(--white);border:3px solid var(--ink);border-radius:26px;box-shadow:6px 6px 0 var(--ink);padding:20px;margin:22px 0}
.tilt-l{transform:rotate(-1.2deg)} .tilt-r{transform:rotate(1deg)}
.hero{display:flex;gap:16px;align-items:center}
.hero svg{flex:none;width:92px;height:92px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--butter);border:3px solid var(--ink);border-radius:99px;padding:4px 14px;font-family:var(--hd);font-size:17px;box-shadow:3px 3px 0 var(--ink)}
label{display:block;font-family:var(--hd);font-size:16px;margin:14px 0 6px}
input[type=text]{width:100%;font:700 22px var(--bd);color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 14px;outline:none}
input[type=text]:focus-visible,button:focus-visible,a:focus-visible{outline:4px solid var(--pink);outline-offset:2px}
button,.btn{font:500 18px var(--hd);color:var(--ink);background:var(--mint);border:3px solid var(--ink);border-radius:99px;padding:10px 22px;box-shadow:4px 4px 0 var(--ink);cursor:pointer;text-decoration:none;display:inline-block;transition:transform .08s,box-shadow .08s}
button:active,.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
button:disabled{background:#e4e9f2;color:#7b88a3;cursor:not-allowed}
.pink{background:var(--pink)} .butter{background:var(--butter)} .dark{background:var(--ink);color:var(--white)}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}
.q{background:var(--white);border:3px solid var(--ink);border-radius:22px;padding:14px 16px;margin:14px 0;box-shadow:4px 4px 0 var(--ink)}
.q.done{background:#effff7}
.q .t{font-size:21px;margin-bottom:10px}
.q .t i{font-style:normal;font-family:var(--hd);background:var(--butter);border:2px solid var(--ink);border-radius:99px;padding:0 9px;margin-right:8px;font-size:15px}
.chips{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.chips button{padding:0;aspect-ratio:1;box-shadow:2px 2px 0 var(--ink);border-width:2.5px;font-size:15px;background:#fff;min-width:0}
.chips button[aria-pressed=true]{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.scale{display:flex;justify-content:space-between;font-size:16px;margin-top:6px;opacity:.75}
.prog{position:sticky;top:8px;z-index:5;background:var(--white);border:3px solid var(--ink);border-radius:99px;padding:6px 14px;display:flex;gap:12px;align-items:center;box-shadow:3px 3px 0 var(--ink)}
.prog .bar{flex:1;height:14px;border:2.5px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden}
.prog .bar b{display:block;height:100%;background:var(--pink);width:0;transition:width .25s}
.prog span{font-family:var(--hd);font-size:16px}
.qedit{display:flex;gap:8px;margin:8px 0}
.qedit input{font-size:18px;padding:6px 12px}
.qedit button{padding:0 14px;background:var(--pink);box-shadow:2px 2px 0 var(--ink)}
.big{font-family:var(--hd);font-size:78px;line-height:1}
.big small{font-size:28px}
.score{text-align:center}
.score svg{width:130px;height:130px}
.linkbox{word-break:break-all;background:#fff;border:3px dashed var(--ink);border-radius:16px;padding:10px 12px;font-size:17px;margin-top:10px}
.bars .b{margin:10px 0}
.bars .b div{height:16px;border:2.5px solid var(--ink);border-radius:99px;background:#fff;overflow:hidden;margin-top:3px}
.bars .b div i{display:block;height:100%;background:var(--mint)}
.bars .b span{display:flex;justify-content:space-between;gap:10px;font-size:18px}
.rater{display:flex;justify-content:space-between;border-bottom:3px dotted var(--ink);padding:6px 0}
.rater:last-child{border:0}
.note{font-size:18px;opacity:.8}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--white);padding:8px 18px;border-radius:99px;font-family:var(--hd);font-size:16px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.tlogo{width:22px;height:22px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:420px){body{font-size:19px}.chips{gap:3px}.chips button{font-size:13px;border-width:2px}.big{font-size:64px}}
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast" role="status"></div>

<script>
const DEF=[
"Replies to people in a friendly way",
"Posts that make you laugh",
"Stays out of drama",
"Stays calm when someone disagrees",
"Gives credit to other people",
"Shares other people's good posts",
"Same person online and in real life",
"Makes you smile when they show up in your feed",
"Doesn't overshare",
"Leaves thoughtful comments",
"Respects other people's opinions",
"Doesn't chase likes",
"Original, not copy-paste",
"Would be fun in a group chat",
"Replies fast",
"Doesn't pick fights in comments",
"Supports small creators",
"Profile and posting vibe",
"Kind to strangers",
"You'd follow them even if you'd never met"
];

const $=s=>document.querySelector(s), app=$('#app');
const P=new URLSearchParams(location.search);
const BASE=location.href.split(/[?#]/)[0];
const enc=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const dec=s=>JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean=n=>String(n||'').replace(/^@+/,'').trim().slice(0,30);
const store={
  get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const fmt=n=>(Math.round(n*10)/10).toFixed(1);
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1600)}
async function copy(t){try{await navigator.clipboard.writeText(t);toast('Copied')}catch(e){prompt('Copy this link',t)}}
function threadsShare(text){window.open('https://www.threads.net/intent/post?text='+encodeURIComponent(text),'_blank','noopener')}

/* little face: mouth curves up with score */
function face(score,size){
  const s=Math.max(0,Math.min(10,score)), m=14+(s-5)*2.6;
  const fill=s>=7?'#7fe3b8':s>=4?'#ffe066':'#ff9ec4';
  return `<svg viewBox="0 0 100 100" aria-hidden="true" ${size?`width="${size}" height="${size}"`:''}>
  <path d="M50 8c20 0 42 10 42 38 0 30-20 46-42 46S8 76 8 46C8 18 30 8 50 8z" fill="${fill}" stroke="#1c2a45" stroke-width="4"/>
  <circle cx="35" cy="42" r="5" fill="#1c2a45"/><circle cx="65" cy="42" r="5" fill="#1c2a45"/>
  <ellipse cx="25" cy="58" rx="7" ry="4.5" fill="#ff9ec4" opacity=".8"/><ellipse cx="75" cy="58" rx="7" ry="4.5" fill="#ff9ec4" opacity=".8"/>
  <path d="M36 62 Q50 ${62+m} 64 62" fill="none" stroke="#1c2a45" stroke-width="4.5" stroke-linecap="round"/></svg>`;
}
const TLOGO='<svg class="tlogo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#1c2a45"/><text x="12" y="17.2" font-size="15" font-weight="700" text-anchor="middle" fill="#fffdf8" font-family="Georgia,serif">@</text></svg>';
const chipColor=v=>v>=7?'#7fe3b8':v>=4?'#ffe066':'#ff9ec4';

function getQs(){return DEF}

/* ---------- home: owner makes their link ---------- */
function home(){
  const saved=store.get('rr:me')||{name:''};
  app.innerHTML=`
  <section class="card tilt-l"><div class="hero">${face(9)}<div>
    <h1>rate my threads vibe</h1>
    <p>Get a link. Share it on Threads. Friends score your online personality out of 10.</p></div></div></section>
  <section class="card">
    <h2>Your link</h2>
    <label for="nm">Your Threads name</label>
    <input type="text" id="nm" placeholder="yourname" autocomplete="off" value="${esc(saved.name)}">
    <div class="row"><button id="make" type="button">Make my link</button></div>
    <div id="out"></div>
  </section>`;
  $('#make').onclick=()=>{
    const n=clean($('#nm').value);
    if(!n) return toast('Add your Threads name first');
    store.set('rr:me',{name:n});
    const url=`${BASE}?n=${encodeURIComponent(n)}`;
    $('#out').innerHTML=`<div class="linkbox">${esc(url)}</div>
      <div class="row"><button type="button" id="cp">Copy link</button>
      <button type="button" class="dark" id="sh">${TLOGO} Post on Threads</button>
      <a class="btn butter" href="?inbox=${encodeURIComponent(n)}">Open my inbox</a></div>
      <p class="note">When someone finishes, they get a link to send you. Open it here and it lands in your inbox.</p>`;
    $('#cp').onclick=()=>copy(url);
    $('#sh').onclick=()=>threadsShare(`Rate my online personality out of 10 (${DEF.length} quick questions)\n${url}`);
    $('#out').scrollIntoView({behavior:'smooth',block:'nearest'});
  };
}

/* ---------- rate someone ---------- */
function rate(){
  const qs=getQs(), target=clean(P.get('n'));
  const ans=new Array(qs.length).fill(0);
  app.innerHTML=`
  <section class="card tilt-r"><div class="hero">${face(8)}<div>
    <h1>how's their online vibe?</h1>
    <p>Score each one from 1 to 10. Takes a minute.</p></div></div>
    <label for="tg">You're rating</label>
    <input type="text" id="tg" value="${esc(target)}" autocomplete="off">
    <label for="me">Your name (leave empty to stay anonymous)</label>
    <input type="text" id="me" placeholder="anonymous" autocomplete="off">
  </section>
  <div class="prog" aria-live="polite"><span id="pc">0/${qs.length}</span><div class="bar"><b id="pb"></b></div></div>
  <div id="qs">${qs.map((t,i)=>`<div class="q" id="q${i}"><div class="t"><i>${i+1}</i>${esc(t)}</div>
    <div class="chips" role="group" aria-label="Score for: ${esc(t)}">${[...Array(10)].map((_,k)=>`<button type="button" data-i="${i}" data-v="${k+1}" aria-pressed="false" aria-label="${k+1} out of 10">${k+1}</button>`).join('')}</div>
    <div class="scale"><span>not really</span><span>totally</span></div></div>`).join('')}</div>
  <div class="row" style="justify-content:center"><button id="send" type="button" disabled>Send my rating</button></div>`;
  const upd=()=>{
    const d=ans.filter(Boolean).length;
    $('#pc').textContent=`${d}/${qs.length}`; $('#pb').style.width=(d/qs.length*100)+'%';
    $('#send').disabled=d<qs.length;
  };
  $('#qs').addEventListener('click',e=>{
    const b=e.target.closest('button[data-v]'); if(!b)return;
    const i=+b.dataset.i, v=+b.dataset.v; ans[i]=v;
    b.parentElement.querySelectorAll('button').forEach(x=>{
      const on=+x.dataset.v===v; x.setAttribute('aria-pressed',on); x.style.background=on?chipColor(v):'#fff';
    });
    $('#q'+i).classList.add('done'); upd();
    const nx=$('#q'+(i+1)); if(nx&&!ans[i+1]) setTimeout(()=>nx.scrollIntoView({behavior:'smooth',block:'center'}),180);
  });
  $('#send').onclick=()=>{
    const tn=clean($('#tg').value); if(!tn) return toast('Who are you rating?');
    done(tn,clean($('#me').value),ans,qs);
  };
}

function done(tn,from,ans,qs){
  const a=avg(ans);
  const link=`${BASE}?r=${enc({n:tn,f:from,s:ans,id:Math.random().toString(36).slice(2,9),t:Date.now()})}`;
  app.innerHTML=`
  <section class="card score tilt-l">${face(a)}
    <div class="big">${fmt(a)}<small>/10</small></div>
    <h2>That's what you gave ${esc(tn)}</h2></section>
  <section class="card">
    <h2>Send it to ${esc(tn)}</h2>
    <p>There's no server here, so your ratings travel inside this link. Only ${esc(tn)} can see them by opening it.</p>
    <div class="linkbox">${esc(link)}</div>
    <div class="row"><button id="cp" type="button">Copy link</button>
    <button id="sh" type="button" class="dark">${TLOGO} Reply on Threads</button></div>
  </section>
  <p style="text-align:center"><a class="btn butter" href="${esc(BASE)}">Make my own link</a></p>`;
  $('#cp').onclick=()=>copy(link);
  $('#sh').onclick=()=>threadsShare(`@${tn} I rated your online vibe. Open this to see it:\n${link}`);
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- owner inbox ---------- */
function inbox(name){
  const key='rr:in:'+name.toLowerCase();
  const items=store.get(key)||[];
  const qs=DEF;
  const all=items.flatMap(x=>x.s);
  app.innerHTML=`
  <section class="card tilt-r"><div class="hero">${face(items.length?avg(all):7)}<div>
    <h1>${esc(name)}'s inbox</h1>
    <p>${items.length?`${items.length} ${items.length===1?'rating':'ratings'} so far`:'Nothing yet. Ratings show up here when you open the links people send you.'}</p></div></div></section>
  ${items.length?`
  <section class="card score"><div class="big">${fmt(avg(all))}<small>/10</small></div><p>average online vibe</p></section>
  <section class="card bars"><h2>By question</h2>
    ${qs.map((t,i)=>{const v=avg(items.map(x=>x.s[i]).filter(Boolean));return `<div class="b"><span><b>${esc(t)}</b><b>${fmt(v)}</b></span><div><i style="width:${v*10}%"></i></div></div>`}).join('')}</section>
  <section class="card"><h2>Who rated</h2>
    ${items.map(x=>`<div class="rater"><span>${x.f?esc(x.f):'anonymous'}</span><span>${fmt(avg(x.s))}/10</span></div>`).join('')}</section>`:''}
  <p style="text-align:center"><a class="btn butter" href="${esc(BASE)}">Back to my link</a></p>`;
}

/* ---------- routing ---------- */
(function(){
  const r=P.get('r');
  if(r){
    try{
      const d=dec(r), n=clean(d.n), key='rr:in:'+n.toLowerCase();
      const list=store.get(key)||[];
      if(!list.some(x=>x.id===d.id)){list.push({id:d.id,f:clean(d.f),s:d.s.map(Number),t:d.t});store.set(key,list)}
      history.replaceState(null,'',BASE+'?inbox='+encodeURIComponent(n));
      return inbox(n);
    }catch(e){app.innerHTML='<section class="card"><h2>That link looks broken</h2><p>Ask them to send it again.</p></section>';return}
  }
  if(P.get('inbox')) return inbox(clean(P.get('inbox')));
  if(P.get('n')) return rate();
  home();
})();
</script>
</body>
</html>
